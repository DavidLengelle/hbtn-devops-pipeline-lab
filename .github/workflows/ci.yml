# ---------------------------------------------------------------------------
# Continuous integration for hbtn-devops-pipeline-lab.
#
# HEADS UP: this workflow is DELIBERATELY BROKEN. It ships with three separate
# faults of three different kinds, and repairing them one commit at a time is
# the pipeline-repair task.
#
# Read the run logs in the Actions tab and let them tell you where to look. Do
# not rewrite the file from scratch: the exercise is the diagnosis, not the
# typing. Each fault has its own signature, and fixing one only gets you as far
# as the next.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/pipeline

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests with JUnit report
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
        run: npm test -- --reporters=default --reporters=jest-junit

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 7
